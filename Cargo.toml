[package]
name = "personal-power-ctrl"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["sink-hs100", "sink-kodi-rpc-cec", "sink-simple-post-api", "sink-snmp", "source-kodi", "source-steamlink", "source-soloist"]
sink-hs100 = ["dep:hs100api"]
sink-kodi-rpc-cec = ["dep:kodi-jsonrpc-client", "dep:reqwest", "dep:serde_json"] # https://github.com/joshjowen/script.json-cec
sink-simple-post-api = ["dep:reqwest"]
sink-snmp = ["dep:snmp2"]
source-kodi = ["dep:kodi-jsonrpc-client", "dep:reqwest"]
source-steamlink = ["dep:anyhow", "dep:ssh2", "dep:futures", "dep:bidirectional-channel"]
source-soloist = ["dep:tokio-tungstenite", "dep:serde_json"]

[dependencies.anyhow]
optional = true
version = "1.0"

[dependencies.async-ctrlc]
version = "1.2"

[dependencies.async-trait]
version = "0.1"

[dependencies.atomic_enum]
version = "0.3"

[dependencies.bidirectional-channel]
optional = true
version = "0.3"

[dependencies.config]
version = "0.15"

[dependencies.futures]
optional = true
version = "0.3"

[dependencies.hs100api]
optional = true
git = "https://github.com/theCapypara/hs100-rust-api.git"
branch = "working"

[dependencies.kodi-jsonrpc-client]
optional = true
git = "https://github.com/marmeladema/rusty-kodi.git"
rev = "13be6ca376a26e3f01564f67dee5d134fc47808c"

[dependencies.reqwest]
optional = true
version = "0.11"

[dependencies.snmp2]
optional = true
version = "0.5"
features = ["tokio"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
optional = true
version = "1.0"

[dependencies.ssh2]
optional = true
version = "0.9"

[dependencies.tokio]
version = "1.53"
features = ["macros", "rt"]

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"

[dependencies.tokio-tungstenite]
optional = true
version = "0.30"
